<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dekel Nissim - 10 Design Ideas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f5f6f8;
        --bar: #ffffff;
        --border: #e2e4e8;
        --border-strong: #cfd2d8;
        --fg: #14161c;
        --muted: #868b94;
        --accent: #3d4b5c;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex; flex-direction: column;
        background: var(--bg); color: var(--fg);
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
      }
      .bar {
        display: flex; align-items: center; gap: 14px;
        padding: 11px 20px;
        background: var(--bar); border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .bar-title { font-family: 'IBM Plex Serif', serif; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; margin-right: 4px; white-space: nowrap; }
      .bar-title span { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: var(--accent); text-transform: uppercase; margin-left: 6px; }
      .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
      .tab {
        border: 1px solid var(--border-strong); background: transparent; color: var(--muted);
        font-family: 'IBM Plex Sans', sans-serif; font-size: 12.5px; font-weight: 500;
        padding: 6px 11px; border-radius: 2px; cursor: pointer;
        display: inline-flex; align-items: center; gap: 7px;
        transition: color 0.15s, background 0.15s, border-color 0.15s;
      }
      .tab:hover { color: var(--fg); border-color: var(--fg); }
      .tab.active { color: #fff; background: var(--fg); border-color: var(--fg); }
      .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .tab .num { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; opacity: 0.7; font-weight: 500; }
      .tab .sw { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.18); }
      .tab.active .sw { border-color: rgba(255,255,255,0.4); }
      .bar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
      .hint { font-size: 12px; color: var(--muted); white-space: nowrap; }
      .hint kbd {
        font-family: 'JetBrains Mono', monospace; font-size: 11px; border: 1px solid var(--border-strong);
        border-radius: 3px; padding: 1px 6px; background: var(--bg);
      }
      .open-new {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 12.5px; font-weight: 500; color: var(--muted); text-decoration: none;
        border: 1px solid var(--border-strong); border-radius: 2px; padding: 6px 11px;
        transition: color 0.15s, border-color 0.15s;
      }
      .open-new:hover { color: var(--fg); border-color: var(--fg); }
      .open-new:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .frame-wrap { flex: 1; position: relative; background: #fff; }
      iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

      @media (max-width: 1100px) { .hint { display: none; } }
      @media (max-width: 820px) { .tab .name { display: none; } }
    </style>
  </head>
  <body>
    <header class="bar">
      <span class="bar-title">Dekel Nissim <span>10 Ideas</span></span>
      <nav class="tabs" aria-label="Design ideas">
        <button class="tab" data-src="option-idea-01-slate.html"><span class="num">1</span><span class="sw" style="background:#3d4b5c"></span><span class="name">Slate</span></button>
        <button class="tab" data-src="option-idea-02-monochrome.html"><span class="num">2</span><span class="sw" style="background:#1c1c1a"></span><span class="name">Monochrome</span></button>
        <button class="tab" data-src="option-idea-03-paper.html"><span class="num">3</span><span class="sw" style="background:#7a5a3a"></span><span class="name">Warm Paper</span></button>
        <button class="tab" data-src="option-idea-04-oxford.html"><span class="num">4</span><span class="sw" style="background:#243b55"></span><span class="name">Oxford Navy</span></button>
        <button class="tab" data-src="option-idea-05-rust.html"><span class="num">5</span><span class="sw" style="background:#9c5b3c"></span><span class="name">Rust</span></button>
        <button class="tab" data-src="option-idea-06-plum.html"><span class="num">6</span><span class="sw" style="background:#5a3550"></span><span class="name">Deep Plum</span></button>
        <button class="tab" data-src="option-idea-07-graphite.html"><span class="num">7</span><span class="sw" style="background:#4a4f57"></span><span class="name">Graphite Dots</span></button>
        <button class="tab" data-src="option-idea-08-serif.html"><span class="num">8</span><span class="sw" style="background:#1c1a17"></span><span class="name">Bold Serif</span></button>
        <button class="tab" data-src="option-idea-09-steel.html"><span class="num">9</span><span class="sw" style="background:#3a5a70"></span><span class="name">Steel Blue</span></button>
        <button class="tab" data-src="option-idea-10-sand.html"><span class="num">0</span><span class="sw" style="background:#6b5d4a"></span><span class="name">Sand Minimal</span></button>
      </nav>
      <div class="bar-right">
        <span class="hint">Switch with <kbd>1</kbd>-<kbd>9</kbd>, <kbd>0</kbd> or <kbd>&larr;</kbd> <kbd>&rarr;</kbd></span>
        <a class="open-new" id="openNew" href="option-idea-01-slate.html" target="_blank" rel="noopener">Open in new tab</a>
      </div>
    </header>

    <div class="frame-wrap">
      <iframe id="frame" title="Design idea preview" src="option-idea-01-slate.html"></iframe>
    </div>

    <script>
      const tabs = Array.from(document.querySelectorAll('.tab'));
      const frame = document.getElementById('frame');
      const openNew = document.getElementById('openNew');

      function select(i) {
        const tab = tabs[i];
        if (!tab) return;
        tabs.forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        const src = tab.dataset.src;
        if (frame.getAttribute('src') !== src) frame.setAttribute('src', src);
        openNew.href = src;
        location.hash = src.replace('.html', '');
      }

      tabs.forEach((tab, i) => tab.addEventListener('click', () => select(i)));

      document.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const current = tabs.findIndex((t) => t.classList.contains('active'));
        if (e.key >= '1' && e.key <= '9') select(Number(e.key) - 1);
        else if (e.key === '0') select(9);
        else if (e.key === 'ArrowRight') select((current + 1) % tabs.length);
        else if (e.key === 'ArrowLeft') select((current - 1 + tabs.length) % tabs.length);
      });

      const fromHash = tabs.findIndex((t) => t.dataset.src.replace('.html', '') === location.hash.slice(1));
      select(fromHash >= 0 ? fromHash : 0);
    </script>
  </body>
</html>
