      - heading "When an Interface Acts Like Someone You Can’t Trust" [level=1] [ref=e27]
      - generic [ref=e28]:
        - generic [ref=e29]: UX Design
        - generic [ref=e30]: Trust
        - generic [ref=e31]: Product
    - generic [ref=e32]:
      - generic:
        - img "When an Interface Acts Like Someone You Can’t Trust"
    - article [ref=e33]:
      - generic [ref=e34]:
        - paragraph [ref=e35]:
          - strong [ref=e36]: "TL;DR:"
          - text: Bugs in an interface are not only a usability problem. Sometimes they are a breach of a small agreement between the system and the user. When a system sends me a verification code and then says the code is wrong, it does not only prevent me from logging in. It damages my trust in it. And in a world where more interfaces are becoming automated, personalized and AI-based, trust is no longer a finishing layer. It is a core part of the product.
        - heading "The Code They Sent Me Was “Wrong”" [level=2] [ref=e37]:
          - strong [ref=e38]: The Code They Sent Me Was “Wrong”
        - paragraph [ref=e39]: "This week I tried to log in to the Israeli Tax Authority website. I entered my details, received a verification code by email, entered the code, and got this message in response: “One of the details is incorrect.”"
        - paragraph [ref=e40]: Beyond the fact that only one detail appeared on the screen at that moment, it was also the same detail they had sent me.
        - paragraph [ref=e41]: So I tried again. And again. And it kept happening. Then I remembered that this was not the first time this had happened to me there. And probably not the last.
        - heading "This Is Not Just a Bug. It Is a Broken Agreement" [level=2] [ref=e42]:
          - strong [ref=e43]: This Is Not Just a Bug. It Is a Broken Agreement
        - paragraph [ref=e44]: "You can compare it to a small agreement between two people. I tell you: come by to pick something up from me, I will leave you a key. You arrive, and there is no key. Or there is a key, but it does not fit the door. Or there is a key, but I tell you it is not the right key."
        - paragraph [ref=e45]: Beyond the frustration and momentary helplessness, something like this mainly breaks trust.
        - paragraph [ref=e46]: "Because when the system says, “We sent you a code,” it is essentially promising something: this code is your way in. If you enter it correctly, we will let you in."
        - paragraph [ref=e47]: And when it does not keep that promise, and then tells you the detail is wrong, it is not only showing a bad error message. It is undermining the small agreement the entire action is built on.
        - heading "We Treat Interfaces More Socially Than We Think" [level=2] [ref=e48]:
          - strong [ref=e49]: We Treat Interfaces More Socially Than We Think
        - paragraph [ref=e50]:
          - text: In the 1990s, Byron Reeves and Clifford Nass coined the term
          - link "The Media Equation" [ref=e51] [cursor=pointer]:
            - /url: https://press.uchicago.edu/ucp/books/book/distributed/M/bo3618528.html
          - text: ": our tendency to treat computers, television and media as if they were real people and places."
        - paragraph [ref=e52]: Their argument was that people respond to computers and interfaces as if they are social actors. This does not mean we actually believe the computer is a person. It means that many of our responses to it use the same social mechanisms we activate with people.
        - paragraph [ref=e53]: And interaction involves trust.
        - heading "When Someone Does Not Keep an Agreement, We Remember" [level=2] [ref=e54]:
          - strong [ref=e55]: When Someone Does Not Keep an Agreement, We Remember
        - paragraph [ref=e56]: "If I tell you I will leave you a key and I do not, you will probably remember that next time. If it happens once, maybe you will think it was a mistake. If it happens again and again, you will build a different model around me: you cannot rely on her promises."
        - paragraph [ref=e57]: The same thing happens with digital systems.
        - paragraph [ref=e58]: Just as you would not necessarily believe me in the future if I commit to something, our trust in systems that promise one thing and deliver something else also erodes. And when someone, or something, does not keep its agreement with us again and again, we remember it.
        - paragraph [ref=e59]:
          - text: There are also studies on trust in automation showing that when automated systems make mistakes, especially in tasks perceived as easy, trust and reliance on them are damaged. In a study on
          - link "automation failures in tasks that are easy for humans" [ref=e60] [cursor=pointer]:
            - /url: https://journals.sagepub.com/doi/10.1518/001872006777724408
          - text: ", the researchers found that when a system misses precisely the things people perceive as easy, trust in it is especially harmed."
        - paragraph [ref=e61]: And that is exactly the point here.
        - paragraph [ref=e62]: "A verification code is not a complex feature from the user’s perspective. It is a very basic contract: you sent me a code, I enter it, you let me in."
        - paragraph [ref=e63]: If even that does not work, why would I trust you with more complex actions?
        - heading "A Pretty Interface Does Not Fix Broken Trust" [level=2] [ref=e64]:
          - strong [ref=e65]: A Pretty Interface Does Not Fix Broken Trust
        - paragraph [ref=e66]: Just like with people, nice words are not enough.
        - paragraph [ref=e67]: A pleasant-looking interface is not enough either.
        - paragraph [ref=e68]: You can write friendly microcopy, design a beautiful error message, add animation, polish the buttons and explain to the user what to do now. But if the system breaks its basic promise, none of that really solves the problem.
        - paragraph [ref=e69]: "Because trust is not built only through tone. It is built by the system doing what it said it would do: consistently, on time, and without making the user feel that they are the problem."
        - heading "In the Age of AI, This Problem Becomes More Critical" [level=2] [ref=e70]:
          - strong [ref=e71]: In the Age of AI, This Problem Becomes More Critical
        - paragraph [ref=e72]: The world is changing, and interfaces are changing with it. It is unclear how many forms we will still fill out ourselves, how many daily tasks will be performed through agents, and how many actions that currently require us to navigate an interface will move into conversation, automation or behind-the-scenes execution.
        - paragraph [ref=e73]: But until we live in a world where no human touches a computer and all the agents manage everything among themselves, the trust problem only becomes more important. As interfaces take on more responsibility - explaining, recommending, filling, sending, deciding or executing - the importance of accuracy, consistency and the ability to admit limitations grows.
        - paragraph [ref=e74]: "In a regular interface, a breach of trust may be an incorrect error message or an action that does not happen as promised. In an AI-based interface, the problem can be more complex: the system can formulate a persuasive answer, with full confidence, even when it is wrong. From the user’s perspective, it does not matter whether behind the scenes it is a model hallucination, a data issue, a broken integration or imprecise wording. The experience is the same: the system said something that was not true."
        - paragraph [ref=e75]: And this changes the level of responsibility for anyone designing these interfaces. It is not enough to ask how to make the system answer. We need to ask how it behaves when it is uncertain, how it explains the source of the information, how it allows the user to check or correct it, and what happens when there is a gap between what the system promised and what it can actually do.
        - heading "Trust Is Not a Finishing Layer" [level=2] [ref=e76]:
          - strong [ref=e77]: Trust Is Not a Finishing Layer
        - paragraph [ref=e78]: "We often talk about trust as if it is something we can add at the end: more transparency, another explanation, a better error message, more reassuring microcopy. But trust is not built only by how we explain to the user what happened. It is built through the alignment between what the system says it does and what it actually does."
        - paragraph [ref=e79]: If the system sends a code, the code needs to work. If it says a detail is incorrect, it needs to be able to point to the relevant detail. If it cannot complete an action, it needs to give the user a real recovery path. And if it does not know, especially in the age of AI, it needs to be able to say that clearly instead of pretending it has an answer.
        - paragraph [ref=e80]: In the end, an interface does not need to be perfect for us to trust it. Mistakes happen, systems fail, and people know how to handle errors when they are explained well and there is a way out. But when the system breaks its small agreement with the user again and again, it not only creates local friction. It teaches the user to be careful with it next time.