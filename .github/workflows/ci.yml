---
name: '🏗️ CI'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: 'CI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: 'ci-${{ github.workflow }}-${{ github.ref }}'
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v5

      - name: 'Setup Node.js'
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 'Install dependencies (self-healing lockfile)'
        run: |
          npm ci || {
            echo "::warning::npm ci failed — package-lock.json is out of sync with package.json (often a macOS-generated lock that can drop Linux-only optional deps). Regenerating a clean lockfile with 'rm -rf node_modules package-lock.json && npm install --include=optional'."
            rm -rf node_modules package-lock.json
            npm install --include=optional
          }

      - name: 'Lint'
        run: npm run lint

      - name: 'Check formatting'
        run: npm run format:check

      - name: 'Typecheck'
        run: npm run typecheck

      - name: 'Test'
        run: npm test

      - name: 'Build'
        run: npm run build
