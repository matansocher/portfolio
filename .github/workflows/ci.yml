---
name: '🏗️ CI'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: 'CI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: 'ci-${{ github.workflow }}-${{ github.ref }}'
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 'Install dependencies (validates lockfile)'
        run: |
          npm ci || {
            echo "::error::npm ci failed — package-lock.json is out of sync with package.json. This usually happens when the lock was regenerated with 'npm install' on macOS, which can drop Linux-only optional deps. Fix on a clean checkout: rm -rf node_modules package-lock.json && npm install, then commit package-lock.json."
            exit 1
          }

      - name: 'Lint'
        run: npm run lint

      - name: 'Check formatting'
        run: npm run format:check

      - name: 'Typecheck'
        run: npm run typecheck

      - name: 'Build'
        run: npm run build
